[project]
name = "cortex-lite"
version = "0.1.0"
description = "Memória persistente (SQLite + FTS5) para agentes do Claude Code, via MCP e hooks."
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
cortexlite = "cortexlite.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cortexlite"]
